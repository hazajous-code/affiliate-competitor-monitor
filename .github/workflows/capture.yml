name: daily-capture

on:
  schedule:
    - cron: "7 13 * * *"   # 매일 13:07 UTC = 미국 동부 09:07(EDT) / 08:07(EST)
  workflow_dispatch:
    inputs:
      targets:
        description: "특정 대상만 다시 수집 (target id, 공백 구분). 비우면 전체"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Restore screenshots from the rolling 'shots' branch
        run: |
          mkdir -p site/shots
          if git ls-remote --exit-code --heads origin shots >/dev/null; then
            git fetch -q --depth 1 origin shots
            git archive FETCH_HEAD | tar -x -C site/shots
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Capture publisher pages
        run: python scripts/capture.py ${{ github.event.inputs.targets }}
      - name: Check integrity and public-safety
        run: python scripts/verify.py
      - name: Save screenshots (single-commit branch, history does not grow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/shots && mkdir /tmp/shots && cp -r site/shots/. /tmp/shots/
          cd /tmp/shots
          git init -q -b shots
          git add -A
          git -c user.name=capture-bot -c user.email=capture-bot@users.noreply.github.com commit -qm "screenshots $(TZ=America/New_York date +%F)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" shots:shots
      - name: Commit results
        run: |
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          git add site
          git diff --cached --quiet || git commit -m "capture: $(TZ=America/New_York date +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: capture
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
