name: probe4
on:
  push:
    branches: [probe4]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python probe/sites.py || true
      - run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -f probe && git commit -m "probe4 output [skip ci]" && git push
