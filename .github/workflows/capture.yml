name: daily-capture

on:
  schedule:
    - cron: "7 13 * * *"   # 매일 13:07 UTC = 미국 동부 09:07(EDT) / 08:07(EST)
  workflow_dispatch:
    inputs:
      targets:
        description: "특정 대상만 다시 수집 (target id, 공백 구분). 비우면 전체"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Capture publisher pages
        run: python scripts/capture.py ${{ github.event.inputs.targets }}
      - name: Commit results
        run: |
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          git add site
          git diff --cached --quiet || git commit -m "capture: $(TZ=America/New_York date +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: capture
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
